# SPDX-License-Identifier: LGPL-2.1-or-later

[package]
name = "awra"
version = "1.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Safe gtk-rs bindings for the Awra UI framework"
documentation = "https://docs.rs/awra"
repository = "https://github.com/MehdiSenhajYnov/Awra"
homepage = "https://github.com/MehdiSenhajYnov/Awra"
readme = "../README.md"
keywords = ["gtk", "gtk4", "gui", "ui", "awra"]
categories = ["gui", "api-bindings"]
rust-version = "1.83"

[dependencies]
awra-sys = { path = "../awra-sys", version = "1.1.0" }
bitflags = "2"
gio = "0.22.0"
glib = "0.22.0"
gdk = { package = "gdk4", version = "0.11.0" }
gtk = { package = "gtk4", version = "0.11.0", features = ["v4_20"] }

[features]
# Awra 1.1 API (documented "Since: 1.1"); it needs libawra 1.1 or later.
default = ["gtk_v4_20", "v1_1"]
v1_1 = ["awra-sys/v1_1"]
gtk_v4_2 = ["gtk/v4_2"]
gtk_v4_6 = ["gtk/v4_6", "gtk_v4_2"]
gtk_v4_8 = ["gtk/v4_8", "gtk_v4_6"]
gtk_v4_10 = ["gtk/v4_10", "gtk_v4_8"]
gtk_v4_12 = ["gtk/v4_12", "gtk_v4_10"]
gtk_v4_18 = ["gtk/v4_18", "gtk_v4_12"]
gtk_v4_20 = ["gtk/v4_20", "gtk_v4_18"]
gtk_v4_24 = ["gtk/v4_24", "gtk_v4_20"]
