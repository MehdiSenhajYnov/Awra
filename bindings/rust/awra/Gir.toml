[[object]]
name = "Awra.FramePool"
status = "generate"
concurrency = "send+sync"
    [[object.function]]
    name = "new"
    assertion = "none"

[[object]]
name = "Awra.Frame"
status = "generate"

[[object]]
name = "Awra.Inspector"
status = "generate"
    [[object.function]]
    name = "export_report"
    ignore = true
