name: Awra CI

on:
  push:
  pull_request:

jobs:
  build-test-install:
    runs-on: ubuntu-latest
    container: fedora:rawhide
    env:
      XDG_RUNTIME_DIR: /tmp/awra-runtime
      GSK_RENDERER: cairo
      GDK_DEBUG: no-portals
      GTK_A11Y: none
    steps:
      - name: Dependencies
        run: >-
          dnf install -y --disablerepo=fedora-cisco-openh264
          gcc clang meson ninja-build pkgconf-pkg-config
          gtk4-devel glib2-devel gobject-introspection-devel vala
          wayland-devel wayland-protocols-devel wayland-utils
          python3 python3-gobject xvfb-run dbus-x11 git rust cargo
          dbus-daemon dbus-tools libglvnd-gles
          gi-docgen gettext graphviz
      - uses: actions/checkout@v4
      - name: Prepare headless runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dbus-uuidgen > /etc/machine-id
          install -d -m 700 "$XDG_RUNTIME_DIR"
      - name: Configure and compile
        run: meson setup _build --prefix=/opt/awra -Ddeveloper=true && meson compile -C _build
      - name: Prepare locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path tests/consumers/rust-experimental/Cargo.toml
          cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
      - name: Test
        run: dbus-run-session -- xvfb-run -a meson test -C _build --print-errorlogs
      - name: Clean install consumers
        run: dbus-run-session -- xvfb-run -a ./build-aux/validate-install.sh _build
      - name: Distribution archive
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          meson dist -C _build --no-tests
          sha256sum _build/meson-dist/awra-*.tar.xz > /tmp/awra-dist.sha256
          meson dist -C _build --no-tests
          sha256sum --check /tmp/awra-dist.sha256
      - name: Meson subproject consumer
        run: ./build-aux/validate-subproject.sh

  generic-backend:
    runs-on: ubuntu-latest
    container: fedora:rawhide
    env:
      XDG_RUNTIME_DIR: /tmp/awra-runtime
      GSK_RENDERER: cairo
      GDK_DEBUG: no-portals
      GTK_A11Y: none
    steps:
      - name: Dependencies
        run: >-
          dnf install -y --disablerepo=fedora-cisco-openh264
          gcc meson ninja-build pkgconf-pkg-config
          gtk4-devel glib2-devel gobject-introspection-devel vala
          python3 python3-gobject xvfb-run dbus-x11 git
          dbus-daemon dbus-tools libglvnd-gles
      - uses: actions/checkout@v4
      - name: Prepare headless runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dbus-uuidgen > /etc/machine-id
          install -d -m 700 "$XDG_RUNTIME_DIR"
      - name: Build without Wayland effects
        run: >-
          meson setup _build-generic -Dwayland-effects=disabled
          -Ddeveloper=false && meson compile -C _build-generic
      - name: Generic fallback suite
        run: dbus-run-session -- xvfb-run -a meson test -C _build-generic --print-errorlogs

  sanitizers:
    runs-on: ubuntu-latest
    container: fedora:rawhide
    env:
      XDG_RUNTIME_DIR: /tmp/awra-runtime
      GSK_RENDERER: cairo
      GDK_DEBUG: no-portals
      GTK_A11Y: none
    steps:
      - name: Dependencies
        run: >-
          dnf install -y --disablerepo=fedora-cisco-openh264
          clang meson ninja-build pkgconf-pkg-config
          gtk4-devel glib2-devel wayland-devel wayland-protocols-devel
          wayland-utils xvfb-run dbus-x11 git
          dbus-daemon dbus-tools libglvnd-gles
      - uses: actions/checkout@v4
      - name: Prepare headless runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dbus-uuidgen > /etc/machine-id
          install -d -m 700 "$XDG_RUNTIME_DIR"
      - name: ASan and UBSan
        run: dbus-run-session -- xvfb-run -a ./build-aux/run-sanitizers.sh _build-sanitize
